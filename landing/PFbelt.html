<style>
  :root{
    --void:#0a0817; --purple:#b765b2; --teal:#1ea689; --pink:#e26d9c;
    --star:#f4f1ff; --soft:#d9d4f0; --dim:#948fbf; --ring:rgba(217,205,255,.16);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; font-family:'Vazirmatn',sans-serif; color:var(--soft); line-height:1.9;
    background:
      radial-gradient(ellipse 90% 60% at 18% -10%, rgba(183,101,178,.35), transparent 60%),
      radial-gradient(ellipse 80% 50% at 100% 10%, rgba(30,166,137,.28), transparent 55%),
      radial-gradient(ellipse 70% 60% at 50% 120%, rgba(226,109,156,.18), transparent 60%), var(--void);
    background-attachment:fixed; overflow-x:hidden; overflow-x:clip;
  }
  html{overflow-x:hidden; overflow-x:clip; max-width:100%;}
  main{max-width:480px; margin:0 auto; padding:18px 20px 110px;}
  section{margin:0 0 44px;}
  h1,h2,h3,p{margin:0;}
  h2{font-size:1.25rem; font-weight:800; color:var(--star); margin-bottom:6px;}
  .sub{font-size:.88rem; color:var(--dim); margin-bottom:18px;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:3px;}

  /* top bar */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; font-size:.82rem;}
  .brand{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--star); font-weight:700;}
  .brand img{width:28px; height:28px; border-radius:50%;}
  .topbar a.more{color:var(--dim); text-decoration:none;}

  /* hero */
  .hero{text-align:center; overflow-x:clip;}
  .porthole{position:relative; width:min(78vw,300px); aspect-ratio:1; margin:0 auto 26px;}
  .porthole::before{content:""; position:absolute; inset:-10px; border-radius:50%;
    border:1.5px dashed rgba(30,166,137,.5); animation:spin 40s linear infinite;}
  .porthole::after{content:""; position:absolute; inset:-10px; border-radius:50%;
    background:radial-gradient(circle at 50% 0, var(--pink) 0 3.5px, rgba(226,109,156,.35) 4px, transparent 10px); animation:spin 14s linear infinite, glow 3s ease-in-out infinite;}
  @keyframes glow{0%,100%{opacity:.55;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .porthole .img{width:100%; height:100%; border-radius:50%; overflow:hidden; border:3px solid var(--ring);
    background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; font-size:5rem;}
  .porthole img{width:100%; height:100%; object-fit:cover; display:block;}
  .badge-off{position:absolute; bottom:4px; right:-6px; background:var(--pink); color:#2a0716; font-weight:800;
    border-radius:999px; padding:6px 14px; font-size:.95rem; transform:rotate(-6deg); z-index:2;}
  h1{font-size:clamp(1.6rem,7vw,2.1rem); font-weight:800; line-height:1.5; color:var(--star); margin-bottom:10px;}
  .lead{font-size:.98rem; color:var(--soft); max-width:360px; margin:0 auto 18px;}
  .price{display:flex; justify-content:center; align-items:baseline; gap:10px; margin-bottom:16px;}
  .price .now{font-size:1.5rem; font-weight:800; color:var(--star);}
  .price .old{font-size:.95rem; color:var(--dim); text-decoration:line-through;}
  .price small{color:var(--dim); font-size:.8rem;}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; cursor:pointer;
    font-family:inherit; font-weight:800; font-size:1.05rem; text-decoration:none; border-radius:16px; padding:15px 18px;
    background:var(--teal); color:#08241e; box-shadow:0 0 28px rgba(30,166,137,.4); transition:transform .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn.ghost{background:transparent; color:var(--soft); border:1px solid var(--ring); box-shadow:none; font-weight:600; font-size:.92rem;}
  .hint{font-size:.78rem; color:var(--dim); margin-top:10px; text-align:center;}

  /* trust */
  .trust{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center;}
  .trust div{border:1px solid var(--ring); border-radius:14px; padding:12px 6px; background:rgba(255,255,255,.035); font-size:.78rem;}
  .trust b{display:block; font-size:1.3rem; margin-bottom:2px;}

  /* problem */
  .problem{border-right:3px solid var(--pink); padding:4px 16px 4px 0;}
  .problem p{font-size:.95rem;}

  /* benefits */
  .benefits{display:flex; flex-direction:column; gap:12px;}
  .benefit{display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border:1px solid var(--ring);
    border-radius:16px; background:rgba(255,255,255,.035);}
  .benefit .ic{flex:0 0 40px; height:40px; border-radius:12px; background:rgba(30,166,137,.14); display:flex;
    align-items:center; justify-content:center; font-size:1.3rem;}
  .benefit h3{font-size:.98rem; color:var(--star); line-height:1.6;}
  .benefit p{font-size:.84rem; color:var(--dim);}

  /* gallery + video */
  .gallery{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:8px;}
  .gimg{flex:0 0 74%; max-width:340px; aspect-ratio:1/1; scroll-snap-align:center; border-radius:18px; border:1px solid var(--ring); overflow:hidden; background:rgba(255,255,255,.05);}
  .gimg img{display:block; width:100%; height:100%; object-fit:cover;}
  .video{border-radius:18px; overflow:hidden; border:1px solid var(--ring); background:#000;}
  .video video,.video iframe{width:100%; display:block; aspect-ratio:9/16; max-height:560px; border:0;}

  /* steps */
  .steps{display:flex; flex-direction:column; gap:10px; counter-reset:s;}
  .step{display:flex; gap:12px; align-items:center; font-size:.92rem;}
  .step::before{counter-increment:s; content:counter(s); flex:0 0 30px; height:30px; border-radius:50%;
    background:var(--purple); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center;}

  /* reviews */
  .reviews{display:flex; flex-direction:column; gap:12px;}
  .review{padding:14px 16px; border:1px solid var(--ring); border-radius:16px; background:rgba(255,255,255,.035); font-size:.9rem;}
  .review .who{margin-top:6px; font-size:.78rem; color:var(--dim);}
  .stars{color:#f2c14e; letter-spacing:2px; font-size:.85rem;}

  /* faq */
  details{border:1px solid var(--ring); border-radius:14px; background:rgba(255,255,255,.035); margin-bottom:10px; overflow:hidden;}
  summary{cursor:pointer; padding:14px 16px; font-weight:600; font-size:.92rem; color:var(--star); list-style:none; display:flex; justify-content:space-between; gap:10px;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"+"; color:var(--teal); font-size:1.2rem; line-height:1;}
  details[open] summary::after{content:"−";}
  details p{padding:0 16px 14px; font-size:.88rem; color:var(--soft);}

  /* buy box */
  .buybox{border:1.5px dashed rgba(30,166,137,.55); border-radius:24px 24px 24px 6px; padding:20px;
    background:radial-gradient(ellipse 80% 120% at 100% 0%, rgba(30,166,137,.16), transparent 60%), rgba(30,166,137,.05);}
  .or{text-align:center; font-size:.78rem; color:var(--dim); margin:14px 0;}
  .sms{background:rgba(10,8,23,.55); border:1px dashed var(--ring); border-radius:14px; padding:14px; font-size:.86rem; text-align:center;}
  .sms code{display:inline-block; direction:ltr; background:rgba(255,255,255,.08); padding:2px 10px; border-radius:8px; color:var(--star); font-size:1rem; margin:0 4px;}
  .sms .row{display:flex; gap:8px; margin-top:12px;}
  .sms .row .btn{padding:11px 10px; font-size:.88rem;}
  .btn.sms-btn{background:var(--purple); color:#fff; box-shadow:none;}

  footer{text-align:center; font-size:.8rem; color:var(--dim); border-top:1px solid var(--ring); padding-top:18px;}
  footer a{text-decoration:none; margin:0 8px;}

  /* sticky cta */
  .sticky{position:fixed; inset:auto 0 0 0; z-index:20; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(10,8,23,.88); backdrop-filter:blur(10px); border-top:1px solid var(--ring);
    transform:translateY(110%); transition:transform .3s;}
  .sticky.show{transform:none;}
  .sticky .inner{max-width:480px; margin:0 auto; display:flex; gap:12px; align-items:center;}
  .sticky .p{font-weight:800; color:var(--star); white-space:nowrap;}
  .sticky .btn{padding:12px 14px;}

  @media (prefers-reduced-motion:reduce){ .porthole::before,.porthole::after{animation:none;} html{scroll-behavior:auto;} }

  /* hero swipe inside porthole */
  .porthole .img{display:flex; align-items:stretch; justify-content:flex-start; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;}
  .porthole .img::-webkit-scrollbar{display:none;}
  .porthole .img>*{flex:0 0 100%; scroll-snap-align:center; width:100%; height:100%; object-fit:cover;}
  .porthole .img>.emo{display:flex; align-items:center; justify-content:center; font-size:5rem;}
  .dots{display:flex; justify-content:center; gap:7px; margin:-8px 0 20px;}
  .dots i{width:7px; height:7px; border-radius:50%; background:var(--ring); transition:background .2s, transform .2s;}
  .dots i.on{background:var(--teal); transform:scale(1.3);}
  .rate{font-size:.85rem; color:var(--dim); margin-bottom:12px;}
  .rate .stars{font-size:1rem;}

  /* pain points */
  .pains{display:flex; flex-direction:column; gap:12px;}
  .pain{padding:14px 16px; border-right:3px solid var(--pink); background:rgba(226,109,156,.06); border-radius:12px; font-size:.9rem;}
  .pain b{display:block; color:var(--star); margin-bottom:2px; font-size:.95rem;}

  /* scrollers (videos, reviews) */
  .scroller{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 10px; margin:0 -20px; padding-inline:20px; scrollbar-width:none;}
  .scroller::-webkit-scrollbar{display:none;}
  .vcard{position:relative; flex:0 0 62%; scroll-snap-align:center; aspect-ratio:9/16; border-radius:18px; overflow:hidden; border:1px solid var(--ring); background:#000; cursor:pointer;}
  .vcard video,.vcard iframe{width:100%; height:100%; object-fit:cover; display:block; border:0;}
  .vcard .play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,8,23,.25); pointer-events:none; transition:opacity .2s;}
  .vcard .play span{width:56px; height:56px; border-radius:50%; background:rgba(244,241,255,.92); color:#2f1354; display:flex; align-items:center; justify-content:center; font-size:1.4rem; padding-inline-start:3px;}
  .vcard.playing .play{opacity:0;}
  .review.card{flex:0 0 82%; scroll-snap-align:center; padding:0; overflow:hidden;}
  .review.card img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block;}
  .review.card .body{padding:14px 16px;}
  .vtag{display:inline-block; font-size:.7rem; color:var(--teal); margin-inline-start:6px;}

  /* guarantee + size */
  .guarantee{display:flex; gap:14px; align-items:flex-start; padding:16px; border-radius:18px; border:1px solid rgba(30,166,137,.4); background:rgba(30,166,137,.08);}
  .guarantee .ic{font-size:1.8rem; line-height:1;}
  .guarantee h3{color:var(--star); font-size:1rem;}
  .guarantee p{font-size:.86rem; color:var(--soft);}
  .size{overflow-x:auto; font-size:.84rem;}
  .size table{width:100%; border-collapse:collapse; text-align:center;}
  .size th,.size td{border:1px solid var(--ring); padding:8px;}
  .size th{background:rgba(255,255,255,.06); color:var(--star);}

  /* offers */
  .offers{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .offer{position:relative; text-align:right; width:100%; font-family:inherit; color:var(--soft); cursor:pointer; padding:14px 16px; border-radius:16px;
    border:1.5px solid var(--ring); background:rgba(255,255,255,.04); display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .offer[aria-pressed="true"]{border-color:var(--teal); background:rgba(30,166,137,.12);}
  .offer b{display:block; color:var(--star); font-size:.95rem;}
  .offer small{color:var(--dim); font-size:.76rem;}
  .offer .pr{white-space:nowrap; font-weight:800; color:var(--star);}
  .offer .pr s{display:block; font-weight:400; font-size:.76rem; color:var(--dim);}
  .offer .tag{position:absolute; top:-10px; left:14px; background:var(--pink); color:#2a0716; font-size:.7rem; font-weight:800; padding:1px 10px; border-radius:999px;}

  /* chat Q&A */
  .chat{display:flex; flex-direction:column; gap:10px;}
  .msg{display:flex; gap:8px; align-items:flex-end; max-width:90%;}
  .msg.q{align-self:flex-start;}
  .msg.a{align-self:flex-end; flex-direction:row-reverse;}
  .msg .av{flex:0 0 30px; width:30px; height:30px; border-radius:50%; overflow:hidden; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:1rem;}
  .msg .av img{width:100%; height:100%; object-fit:cover;}
  .bub{padding:10px 14px; font-size:.88rem; line-height:1.8; border-radius:16px;}
  .msg.q .bub{background:rgba(255,255,255,.08); color:var(--star); border-bottom-right-radius:4px;}
  .msg.a .bub{background:rgba(30,166,137,.16); border:1px solid rgba(30,166,137,.35); color:var(--soft); border-bottom-left-radius:4px;}
  .badges{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:14px;}
  .badges span{border:1px solid var(--ring); border-radius:999px; padding:4px 12px; font-size:.76rem; color:var(--soft);}
</style>
</head>

    { q: 'کدوم مدل رو بخرم؟', a: 'مدل اول باکیفیت، اقتصادی و بدون فلز هست . مدل دوم شیک و راحت و با قلاب فلزی هست، مدل سوم ظاهر چرمی برای کار مجلسی یا کادویی خیلی قشنگ میشه' }

   /* ─────  سری سوم عکس (بعد از خیال راحت) ───── */
  gallery3: ['https://ik.imagekit.io/bisculens/l-PFBelt-C%20(1).jpg','https://ik.imagekit.io/bisculens/l-PFBelt-C%20(2).jpg','https://ik.imagekit.io/bisculens/l-PFBelt-C%20(3).jpg','https://ik.imagekit.io/bisculens/l-PFBelt-C%20(4).jpg'],   
  
  
  /* ───── ۱۱. مراحل خرید ───── */
  steps: [

  faqTitle: 'سوال‌های رایج ارسال و خرید',
  faq: [

    { q: 'چند روزه می‌رسد؟', a: ' ارسال با شرکت های پستی انجام مشه  بین ۲ تا ۵ روز کاری زمان میبره.' },
    { q: 'هزینه‌ی ارسال چقدر است؟', a: 'قیمت پست 150 هزارتومان است و کسانی که پرداخت در محل انتخاب میکنند این هزینه را هم باید بدهند اما برای کسانی که پرداخت آنلاین را انتخاب کنند کمربند اول، ده درصد تخفیف و کمربند دوم هزینه ارسال صفر میشود' },

    { q: 'کدرهگیری می‌دهید؟', a: 'بله و علاوه بر آن در داخل وبسایت بخش پیگیری قرار داده شده' },

   // { q: 'اگر کالا را قبل از پرداخت ببینم، می‌توانم پس بدهم؟', a: 'اینجا شرایط واقعی تحویل در محل را بنویس.' },

    { q: 'اگر کالا با آنچه خریدم تطابق نداشت چه؟', a: 'نگران نباشید تا سه روز فرصت مرجوعی کالا رو دارید' },
    { q: 'اگر کالا معیوب بود چه کار کنم؟', a: 'برای مرجوع کردن با فروشگاه تماس بگیرید یا به آدرس زیر ایمیل بزنید | تلفن مدل ساده  02491003632تلفن مدل قلاب فلزی  02191093361 تلفن مدل لوکس 02171057611' }
  ],

  /* ───── ۱۳. راه‌های خرید ───── */
  buy: {
    fastUrl: '',                      // لینک خرید سریع
    fastLabel: 'خرید سریع',
    smsCode: '',                      // کد پیامکی محصول
    smsNumber: ''                     // شماره پیامک
  },
  closing: 'منتظر چی هستی؟ یک مدل انتخاب کن تا زودتر برات بفرستیمش 💜',
  offers: [], 
  
  offers: [
   { label: 'مدل قلاب فلزی', note: 'محکم و تولید داخل', price: 898000, oldPrice: 1089000, fastUrl: 'https://meu-meu.ir/product/brief/63572/141407', smsCode: '668503', smsNumber: '3000741988', tag: 'پرفروش‌ترین' },
   { label: 'مدل تمام پارچه', note: 'محکم بدون بسط فلزی', price: 398000, fastUrl: 'http://www.bipbeep.ir/addcart.php?action=add&id=1940', smsCode: '107326194000', smsNumber: '10000309' },
  { label: 'مدل لوکس', note: 'ظاهر چرمی', price: 1089000, oldPrice: 1500000, fastUrl: 'http://miu-miu.ir/lightcart/4015?sid=80207', smsCode: '605095', smsNumber: '10002342' }
],

  // پیشنهادهای چندتایی (اختیاری)

  /* ───── ۱۴. پایین صفحه ───── */
  footerBadges: ['✅ دارای اینماد', '🛒 حضور در ترب'],
  homeUrl: 'https://peykfazayi.ir/',
  searchUrl: 'https://peykfazayi.ir/search.html',
  logo: 'https://bargesheni.ir/wp-content/uploads/2026/09/transsparent-peyk.png'
};
/* ========================= پایان بخش ویرایش ========================= */

const C = CONFIG, $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const track = (name) => { try { gtag('event', name, { campaign: C.slug }); } catch(e){} };

function utm(url){
  try{ const u = new URL(url);
    u.searchParams.set('utm_source','peykfazayi'); u.searchParams.set('utm_medium','landing'); u.searchParams.set('utm_campaign',C.slug);
    return u.toString(); }catch(e){ return url; }
}
const imgs   = (C.heroImages && C.heroImages.length) ? C.heroImages : (C.heroImage ? [C.heroImage] : []);
function normVid(v){
  if (typeof v === 'string') v = { src: v };
  let src = (v.src || '').trim();
  const m = src.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i); if (m) src = m[1];
  const ap = src.match(/aparat\.com\/v\/([A-Za-z0-9]+)/); if (ap) src = 'https://www.aparat.com/video/video/embed/videohash/' + ap[1] + '/vt/frame';
  return { src, poster: v.poster || '', ratio: v.ratio || '9/16' };
}
const vids   = ((C.videos && C.videos.length) ? C.videos : (C.video ? [C.video] : [])).map(normVid).filter(v => v.src);
const offers = C.offers || [];
let sel = Math.max(0, offers.findIndex(o => o.tag)); if (!offers.length) sel = 0;

const cur      = () => offers.length ? offers[sel] : null;
const curFast  = () => (cur() && cur().fastUrl) || C.buy.fastUrl;
const curCode  = () => (cur() && cur().smsCode) || C.buy.smsCode;
const basePrice= () => C.price || (offers[0] && offers[0].price) || 0;
const curPrice = () => cur() ? cur().price : C.price;
const curOld   = () => cur() ? cur().oldPrice : C.oldPrice;
const pct = (p,o) => (p && o && o > p) ? Math.round((1 - p / o) * 100) : 0;
const curNum   = () => (cur() && cur().smsNumber) || C.buy.smsNumber;

function buyActions(){
  const fast = curFast(), code = curCode(), num = curNum(), hasSms = !!(code && num);
  let h = '';
  if (fast) h += `<a class="btn" data-buy="fast" href="${utm(fast)}" target="_blank" rel="nofollow noopener">${C.buy.fastLabel}</a>`;
  if (fast && hasSms) h += `<div class="or">یا با پیامک سفارش بده</div>`;
  if (hasSms) h += `<div class="sms">کد <code>${code}</code> را به شماره <code>${num}</code> پیامک کن
      <div class="row">
        <a class="btn sms-btn" data-buy="sms" href="sms:${num}?&body=${encodeURIComponent(code)}">ارسال پیامک</a>
        <button class="btn ghost" type="button" data-copy="${code}">کپی کد</button>
      </div></div>`;
  if (!fast && !hasSms) h = `<p class="hint">راه خرید هنوز در بخش buy / offers تنظیم نشده است.</p>`;
  return h;
}
function offersHtml(){
  if (!offers.length) return '';
  return `<div class="offers">${offers.map((o,i) => `<button type="button" class="offer" data-offer="${i}" aria-pressed="${i===sel}">
      ${o.tag ? `<span class="tag">${o.tag}</span>` : ''}
      <span><b>${o.label}</b>${o.note ? `<small>${o.note}</small>` : ''}</span>
      <span class="pr">${fa(o.price)} تومان${o.oldPrice ? `<s>${fa(o.oldPrice)}</s>` : ''}</span></button>`).join('')}</div>`;
}
const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));

const galSec = (imgs, title, def) => (imgs && imgs.length)
  ? `<section>${(title === undefined ? def : title) ? `<h2>${title === undefined ? def : title}</h2>` : ''}<div class="gallery">${imgs.map(g => `<div class="gimg"><img src="${g}" alt="${C.productName}" loading="lazy"></div>`).join('')}</div></section>` : '';
function render(){
  const discount = pct(C.price, C.oldPrice);
  const heroInner = imgs.length ? imgs.map(i => `<img src="${i}" alt="${C.productName}" ${imgs.indexOf(i)===0?'fetchpriority="high"':'loading="lazy"'}>`).join('') : `<div class="emo">${C.emoji}</div>`;
  let h = `
  <div class="topbar">
    <a class="brand" href="${C.homeUrl}"><img src="${C.logo}" alt="">پیک فضایی</a>
    <a class="more" href="${C.searchUrl}">محصول دیگری می‌خواهی؟</a>
  </div>

  <section class="hero">
    <div class="porthole"><div class="img" id="heroScroll">${heroInner}</div>${discount ? `<span class="badge-off">${fa(discount)}٪ تخفیف</span>` : ''}</div>
    ${imgs.length > 1 ? `<div class="dots" id="dots">${imgs.map((_,i) => `<i class="${i===0?'on':''}"></i>`).join('')}</div>` : ''}
    ${C.rating && C.rating.score ? `<div class="rate"><span class="stars">${stars(C.rating.score)}</span> ${fa(C.rating.score)} از ۵${C.rating.count ? ` · ${fa(C.rating.count)} نظر` : ''}</div>` : ''}
    <h1>${C.headline}</h1>
    <p class="lead">${C.lead}</p>
    ${basePrice() ? `<div class="price"><span class="now">${offers.length && !C.price ? 'از ' : ''}${fa(basePrice())} <small>تومان</small></span>${C.oldPrice ? `<span class="old">${fa(C.oldPrice)}</span>` : ''}</div>` : ''}
    <a class="btn" href="#buy" id="heroBtn">${C.buy.fastUrl ? C.buy.fastLabel : 'سفارش بده'}</a>
    ${C.scarcity ? `<p class="hint">${C.scarcity}</p>` : ''}
  </section>`;

  if (C.trust.length) h += `<section class="trust">${C.trust.map(t => `<div><b>${t.icon}</b>${t.text}</div>`).join('')}</section>`;
  if (C.painPoints && C.painPoints.length) h += `<section><h2>${C.painTitle || 'این حس رو می‌شناسی؟'}</h2><div class="pains">${C.painPoints.map(p => `<div class="pain"><b>${p.title}</b>${p.text}</div>`).join('')}</div></section>`;
  else if (C.problem) h += `<section class="problem"><p>${C.problem}</p></section>`;
  h += galSec(C.gallery, C.galleryTitle, 'عکس‌های مدل اول');
  if (C.benefits.length) h += `<section><h2>چرا این محصول؟</h2><div class="benefits">${C.benefits.map(b =>
      `<div class="benefit"><span class="ic">${b.icon}</span><div><h3>${b.title}</h3><p>${b.text}</p></div></div>`).join('')}</div></section>`;
  if (vids.length) h += `<section><h2>${C.videoTitle}</h2><div class="scroller">${vids.map(v => {
      const [w, hh] = v.ratio.split('/').map(Number), wide = w > hh;
      const st = `aspect-ratio:${v.ratio};${wide ? 'flex-basis:88%;' : ''}`;
      return /\.(mp4|webm)(\?|#|$)/i.test(v.src)
        ? `<div class="vcard" style="${st}"><video src="${v.src}#t=0.1" ${v.poster ? `poster="${v.poster}"` : ''} playsinline loop preload="metadata"></video><div class="play"><span>▶</span></div></div>`
        : `<div class="vcard" style="${st}"><iframe src="${v.src}" allowfullscreen allow="fullscreen" loading="lazy"></iframe></div>`; }).join('')}</div></section>`;
  h += galSec(C.gallery2, C.gallery2Title, 'عکس‌های مدل دوم');
  if (C.reviews.length) h += `<section><h2>نظر مشتری‌ها</h2><div class="scroller">${C.reviews.map(r =>
      `<div class="review card">${r.image ? `<img src="${r.image}" alt="" loading="lazy">` : ''}<div class="body"><div class="stars">${stars(r.stars||5)}</div>${r.text}<div class="who">${r.name}</div></div></div>`).join('')}</div></section>`;
  if (C.guarantee && C.guarantee.title) h += `<section><h2>${C.guaranteeTitle || 'خیال راحت'}</h2><div class="guarantee"><span class="ic">🛡️</span><div><h3>${C.guarantee.title}</h3><p>${C.guarantee.text}</p></div></div></section>`;
  h += galSec(C.gallery3, C.gallery3Title, 'عکس های مدل سوم');
  if (C.sizeGuide) h += `<section><h2>راهنمای سایز</h2><div class="size">${C.sizeGuide}</div></section>`;
  if (C.chatFaq && C.chatFaq.length) h += `<section><h2>${C.chatTitle}</h2><div class="chat">${C.chatFaq.map(c =>
      `<div class="msg q"><span class="av">🙋</span><div class="bub">${c.q}</div></div><div class="msg a"><span class="av"><img src="${C.logo}" alt=""></span><div class="bub">${c.a}</div></div>`).join('')}</div></section>`;
  if (C.steps.length) h += `<section><h2>خرید در چند ثانیه</h2><div class="steps">${C.steps.map(s => `<div class="step">${s}</div>`).join('')}</div></section>`;
  if (C.faq.length) h += `<section><h2>${C.faqTitle || 'سوال‌های رایج'}</h2>${C.faq.map(f => `<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join('')}</section>`;

  h += `<section id="buy"><div class="buybox"><h2>${C.closing}</h2>
    ${offersHtml()}
    <p class="sub" id="buyPrice"></p>
    <div id="buyActions"></div></div></section>
  <footer>${(C.footerBadges||[]).length ? `<div class="badges">${C.footerBadges.map(b => `<span>${b}</span>`).join('')}</div>` : ''}<a href="${C.homeUrl}"> پیک فضایی </a><a href="${C.searchUrl}"> جستجوی محصول </a><a href="mailto:peykfazayi.ir@gmail.com"> ایمیل </a></footer>`;

  $('#app').innerHTML = h;
  document.title = C.productName + ' | پیک فضایی';

  function updateBuy(){
    const p = curPrice(), o = curOld(), d = pct(p, o);
    $('#buyPrice').innerHTML = p ? `${fa(p)} تومان${d ? ` · ${fa(d)}٪ تخفیف` : ''}` : '';
    $('#buyActions').innerHTML = buyActions();
    $('#stickyPrice').textContent = p ? fa(p) + ' تومان' : C.productName;
    document.querySelectorAll('[data-offer]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.offer === sel)));
  }
  updateBuy();
  $('#stickyBtn').textContent = C.buy.fastUrl || (cur() && cur().fastUrl) ? C.buy.fastLabel : 'سفارش بده';

  // sticky bar
  const hero = $('#heroBtn'), sticky = $('#sticky'), buy = $('#buy');
  let heroOut = false, buyIn = false;
  const upd = () => sticky.classList.toggle('show', heroOut && !buyIn);
  new IntersectionObserver(e => { heroOut = !e[0].isIntersecting && e[0].boundingClientRect.top < 0; upd(); }).observe(hero);
  new IntersectionObserver(e => { buyIn = e[0].isIntersecting; upd(); }).observe(buy);

  // hero dots
  const hs = $('#heroScroll'), dots = document.querySelectorAll('#dots i');
  if (hs && dots.length) hs.addEventListener('scroll', () => {
    const i = Math.round(Math.abs(hs.scrollLeft) / hs.clientWidth);
    dots.forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });

  // clicks
  document.addEventListener('click', e => {
    const o = e.target.closest('[data-offer]'); if (o) { sel = +o.dataset.offer; updateBuy(); track('select_offer_' + sel); return; }
    const b = e.target.closest('[data-buy]'); if (b) track('buy_' + b.dataset.buy);
    const c = e.target.closest('[data-copy]');
    if (c) { navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy).then(() => { c.textContent = 'کپی شد ✓'; setTimeout(() => c.textContent = 'کپی کد', 1800); }); track('copy_sms_code'); }
    const v = e.target.closest('.vcard');
    if (v && v.querySelector('video')) {
      const vid = v.querySelector('video');
      document.querySelectorAll('.vcard video').forEach(x => { if (x !== vid) { x.pause(); x.closest('.vcard').classList.remove('playing'); } });
      if (vid.paused) { vid.play(); v.classList.add('playing'); track('video_play'); } else { vid.pause(); v.classList.remove('playing'); }
    }
  });
  track('landing_view');
}
render();
</script>
